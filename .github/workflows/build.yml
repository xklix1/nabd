name: Nabd CI/CD Release Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Android Obfuscated Release APK
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Obfuscated Android APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabd-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android Obfuscation Symbols
        uses: actions/upload-artifact@v4
        with:
          name: nabd-android-debug-symbols
          path: build/app/outputs/symbols/

  # 2. Unsigned iOS IPA for Sideloading (ESign / Sideloadly)
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Unsigned iOS Release Bundle
        run: |
          mkdir -p build/ios/symbols
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/ios/symbols

      - name: Package Unsigned .ipa Archive
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r nabd-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabd-ios-unsigned-ipa
          path: nabd-unsigned.ipa

      - name: Upload iOS Obfuscation Symbols
        uses: actions/upload-artifact@v4
        with:
          name: nabd-ios-debug-symbols
          path: build/ios/symbols/

  # 3. Publish Direct Download GitHub Release
  publish-release:
    name: Publish Direct Download Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: nabd-ios-unsigned-ipa
          path: ./release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: nabd-android-release-apk
          path: ./release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nabd Medical Release (Latest)
          body: |
            ### 🏥 تطبيق نبض (Nabd) - أحدث إصدار مع قاعدة الـ 26 ألف دواء
            
            - **📱 نسخة الآيفون (iOS IPA)**: `nabd-unsigned.ipa` (تتضمن 26,562 دواء مصري وقاعدة بيانات EDA كاملة تعمل أوفلاين 100%).
            - **🤖 نسخة الأندرويد (Android APK)**: `app-release.apk`.
            
            #### 📲 طريقة التثبيت المباشر على الآيفون:
            1. حمل ملف `nabd-unsigned.ipa` من الروابط أدناه.
            2. ثبّته عبر أي أداة توقيع شخصي مثل: **Sideloadly** أو **AltStore** أو **TrollStore** أو **ESign** أو **Scarlet**.
          files: |
            ./release-assets/nabd-unsigned.ipa
            ./release-assets/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

