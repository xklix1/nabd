name: Nabd CI/CD Release Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Android Obfuscated Release APK
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Obfuscated Android APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabd-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android Obfuscation Symbols
        uses: actions/upload-artifact@v4
        with:
          name: nabd-android-debug-symbols
          path: build/app/outputs/symbols/

  # 2. Unsigned iOS IPA for Sideloading (ESign / Sideloadly)
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Unsigned iOS Release Bundle
        run: |
          mkdir -p build/ios/symbols
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/ios/symbols

      - name: Package Unsigned .ipa Archive
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r nabd-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabd-ios-unsigned-ipa
          path: nabd-unsigned.ipa

      - name: Upload iOS Obfuscation Symbols
        uses: actions/upload-artifact@v4
        with:
          name: nabd-ios-debug-symbols
          path: build/ios/symbols/
